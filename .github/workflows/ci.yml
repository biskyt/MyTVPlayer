name: CI

# Pull requests only (the owner, 2026-11-24): a merge to main repeats what its PR checked. Also by hand from the
# Actions tab. The release workflow, which runs on main after each merge, keeps the caches that the PR runs read.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR replaces its run.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # actions/checkout runs "git init", which otherwise prints a hint about the default branch's name.
      - run: git config --global init.defaultBranch main

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Robolectric fetches its Android images (about 250 MB) into ~/.m2 on first use, outside Gradle's cache. The
      # release workflow saves them from main, where every branch can read them.
      - name: Robolectric cache key
        id: robolectric
        run: echo "key=$(.github/scripts/robolectric-cache-key.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}

      - name: Style and static checks
        run: ./gradlew ktlintCheck detekt lintDebug

      # Screenshots show the live clock and programme times, so they are recorded and uploaded for review rather than
      # compared pixel-for-pixel against the committed copies.
      - name: Unit, Robolectric and UI tests (records screenshots)
        run: ./gradlew :core:test :app:recordRoborazziDebug koverXmlReport
        # For TmdbLiveTest, a check against the real TMDB. Without the secret (pull requests from forks) it is not run. The
        # release workflow does not pass the secret: a TMDB outage must not hold up a release.
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          retention-days: 7
          path: |
            app/screenshots/
            **/build/reports/
